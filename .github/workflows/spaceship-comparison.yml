name: Spaceship Universe vs NDQ
on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * 1'
  push:
    branches: [main]
    paths:
      - scripts/compare_spaceship.py
      - scripts/fetch_spaceship.py
      - tests/test_spaceship_comparison.py
      - data/external/spaceship_universe.csv
      - .github/workflows/spaceship-comparison.yml

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Spaceship historical unit prices
        run: PYTHONPATH=. python scripts/fetch_spaceship.py
      - name: Run tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Run Spaceship vs NDQ comparison
        run: PYTHONPATH=. python scripts/compare_spaceship.py
      - name: Commit generated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/spaceship_vs_ndq.csv data/external/spaceship_universe.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update Spaceship vs NDQ comparison"
            git push
          fi
