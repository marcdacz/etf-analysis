name: ETF allocation comparison
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/compare_allocations.py
      - .github/workflows/allocation-comparison.yml
      - config.json
      - etf_backtest/**
      - data/normalized/**
permissions:
  contents: write
concurrency:
  group: allocation-comparison
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compare allocations and refresh README
        run: python scripts/compare_allocations.py
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md results/allocation_comparison.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update BGBL/NDQ allocation results"
            git push
          fi
